# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - heatquiz

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PROJECT_PATH: QuizAPI.csproj
  WORKING_DIR: QuizAPI/QuizAPI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      # QuizAPI targets netcoreapp2.0. Newer SDKs (like .NET 8) won't build it.
      - name: Set up .NET Core SDK 2.1.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "2.1.818"

      # Webpack 2 + old toolchain often breaks on very new Node due to OpenSSL.
      - name: Setup Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install frontend tooling (npm)
        working-directory: ${{ env.WORKING_DIR }}
        run: npm install

      - name: Publish (self-contained, Windows)
        working-directory: ${{ env.WORKING_DIR }}
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -r win-x64 --self-contained true -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write # required for requesting the JWT (OIDC)
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_880BDB85457E4BB5A4BA9757E90370A8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_812100105BF941D29AB58DB8895AEDDD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0A4641C01880459FA7AAAD6AD9DA80A5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: heatquiz
          slot-name: Production
          package: .
